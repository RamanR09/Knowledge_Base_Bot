services:
  db:
    image: pgvector/pgvector:pg17
    container_name: kbchat-db
    environment:
      POSTGRES_USER: kbchat
      POSTGRES_PASSWORD: kbchat_dev_password
      POSTGRES_DB: kbchat
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kbchat -d kbchat"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: ["production"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kbchat-app
    command: ["npm", "run", "start"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://kbchat:kbchat_dev_password@db:5432/kbchat
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy

  worker:
    profiles: ["production"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kbchat-worker
    command: ["npm", "run", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://kbchat:kbchat_dev_password@db:5432/kbchat
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  uploads:
